<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="dots loader">
	<foreignObject x="0" y="0" width="96" height="96">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style><![CDATA[ .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1a1a1a; z-index: 1000; } .loading-spinner { border-bottom: var(--circle-loader-thickness, 8px) solid rgba(0, 0, 0, 0.1); border-top: var(--circle-loader-thickness, 8px) solid rgba(59, 59, 59, 0.1); border-right: var(--circle-loader-thickness, 8px) solid var(--circle-loader-color, rgba(255, 0, 0, 0.938)); border-left: var(--circle-loader-thickness, 8px) solid var(--circle-loader-secondary-color, var(--circle-loader-color, blue)); border-radius: 50%; width: var(--circle-loader-size, 50px); height: var(--circle-loader-size, 50px); animation: spin calc(1s / var(--circle-loader-speed, 1)) linear infinite; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } .loading-text { margin-top: 10px; font-size: var(--circle-loader-text-size, 18px); color: var(--circle-loader-text-color, #f9f9f9); } .loading-overlay.loading-overlay--scoped { position: absolute; z-index: 10; } .loading-overlay--light { background-color: #f8fafc; --circle-loader-text-color: #1f2937; --circle-loader-track: rgba(0, 0, 0, 0.1); } .loading-overlay--dim { background-color: rgba(0, 0, 0, 0.6); } .loading-overlay--blur { background-color: rgba(17, 17, 17, 0.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); } .loading-overlay--transparent { background-color: transparent; --circle-loader-track: rgba(128, 128, 128, 0.25); } .loading-overlay--transparent .loading-text { color: inherit; } @media (prefers-reduced-motion: reduce) { .loading-spinner, .loading-spinner::before, .loading-spinner::after, .loading-spinner > span, .loading-spinner circle { animation-duration: 3s; } } 
.loading-spinner.loading-spinner--dots{animation:none;border:none;position:relative}.loading-spinner--dots>span{--radius:calc(var(--circle-loader-size, 50px)*-0.4);animation:circle-loader-fade calc(.8s/var(--circle-loader-speed, 1)) linear infinite;background-color:var(--circle-loader-color,#3b82f6);border-radius:50%;height:calc(var(--circle-loader-size, 50px)*.16);left:50%;margin:calc(var(--circle-loader-size, 50px)*-.08) 0 0 calc(var(--circle-loader-size, 50px)*-.08);position:absolute;top:50%;width:calc(var(--circle-loader-size, 50px)*.16)}.loading-spinner--dots>span:first-child{animation-delay:calc(-.7s/var(--circle-loader-speed, 1));transform:rotate(0deg) translateY(var(--radius))}.loading-spinner--dots>span:nth-child(2){animation-delay:calc(-.6s/var(--circle-loader-speed, 1));transform:rotate(45deg) translateY(var(--radius))}.loading-spinner--dots>span:nth-child(3){animation-delay:calc(-.5s/var(--circle-loader-speed, 1));transform:rotate(90deg) translateY(var(--radius))}.loading-spinner--dots>span:nth-child(4){animation-delay:calc(-.4s/var(--circle-loader-speed, 1));transform:rotate(135deg) translateY(var(--radius))}.loading-spinner--dots>span:nth-child(5){animation-delay:calc(-.3s/var(--circle-loader-speed, 1));transform:rotate(180deg) translateY(var(--radius))}.loading-spinner--dots>span:nth-child(6){animation-delay:calc(-.2s/var(--circle-loader-speed, 1));transform:rotate(225deg) translateY(var(--radius))}.loading-spinner--dots>span:nth-child(7){animation-delay:calc(-.1s/var(--circle-loader-speed, 1));transform:rotate(270deg) translateY(var(--radius))}.loading-spinner--dots>span:nth-child(8){animation-delay:calc(0s/var(--circle-loader-speed, 1));transform:rotate(315deg) translateY(var(--radius))}@keyframes circle-loader-fade{0%{opacity:1}to{opacity:.15}}

.loading-overlay { position: static; width: 96px; height: 96px; border-radius: 16px; }
]]></style>
			<div class="loading-overlay">
				<div class="loading-spinner loading-spinner--dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
			</div>
		</div>
	</foreignObject>
</svg>
