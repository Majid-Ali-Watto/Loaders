<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="halves loader">
	<foreignObject x="0" y="0" width="96" height="96">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style><![CDATA[ .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1a1a1a; z-index: var(--circle-loader-z-index, 1000); } .loading-spinner { border-bottom: var(--circle-loader-thickness, 8px) solid rgba(0, 0, 0, 0.1); border-top: var(--circle-loader-thickness, 8px) solid rgba(59, 59, 59, 0.1); border-right: var(--circle-loader-thickness, 8px) solid var(--circle-loader-color, rgba(255, 0, 0, 0.938)); border-left: var(--circle-loader-thickness, 8px) solid var(--circle-loader-secondary-color, var(--circle-loader-color, blue)); border-radius: 50%; width: var(--circle-loader-size, 50px); height: var(--circle-loader-size, 50px); animation: spin calc(1s / var(--circle-loader-speed, 1)) linear infinite; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } .loading-text { margin-top: 10px; font-size: var(--circle-loader-text-size, 18px); color: var(--circle-loader-text-color, #f9f9f9); } .loading-progress { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--circle-loader-text-color, #f9f9f9); font-size: calc(var(--circle-loader-text-size, 18px) * 0.75); font-variant-numeric: tabular-nums; } .loading-progress-bar { position: relative; width: calc(var(--circle-loader-size, 50px) * 2.4); height: 4px; border-radius: 2px; overflow: hidden; background: var(--circle-loader-track, rgba(255, 255, 255, 0.15)); } .loading-progress-bar::before { content: ""; position: absolute; inset: 0; background: var(--circle-loader-color, #3b82f6); transform: scaleX(calc(var(--circle-loader-progress, 0) / 100)); transform-origin: 0 50%; transition: transform 0.2s ease; } .loading-progress-label { min-width: 3.2em; text-align: right; } .loading-overlay--transparent .loading-progress { color: inherit; } .loading-overlay.loading-overlay--scoped { position: absolute; z-index: var(--circle-loader-z-index, 10); } .loading-overlay--light { background-color: #f8fafc; --circle-loader-text-color: #1f2937; --circle-loader-track: rgba(0, 0, 0, 0.1); } .loading-overlay--dim { background-color: rgba(0, 0, 0, 0.6); } .loading-overlay--blur { background-color: rgba(17, 17, 17, 0.35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); } .loading-overlay--transparent { background-color: transparent; --circle-loader-track: rgba(128, 128, 128, 0.25); } .loading-overlay--transparent .loading-text { color: inherit; } @media (prefers-reduced-motion: reduce) { .loading-spinner, .loading-spinner::before, .loading-spinner::after, .loading-spinner > span, .loading-spinner circle { animation-duration: 3s; } } 
.loading-spinner.loading-spinner--halves{animation:spin calc(1.2s/var(--circle-loader-speed, 1)) cubic-bezier(.6,0,.4,1) infinite;background:conic-gradient(var(--circle-loader-color,#3b82f6) 0 50%,var(--circle-loader-secondary-color,var(--circle-loader-track,hsla(0,0%,100%,.15))) 0);border:none}

.loading-overlay { position: static; width: 96px; height: 96px; border-radius: 16px; }
]]></style>
			<div class="loading-overlay">
				<div class="loading-spinner loading-spinner--halves"></div>
			</div>
		</div>
	</foreignObject>
</svg>
