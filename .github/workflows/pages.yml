# Builds the package and publishes the playground (demo/ + dist/) to GitHub Pages.
# The site root redirects to demo/. The demo loads ../dist/circle-loader.min.js, so dist/ must be built here.
#
# Build and deploy are separate jobs, as in GitHub's own Pages workflow. In one job, deploy-pages
# sometimes looked for the artifact before it was listed ("No artifacts named github-pages were found").
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits instead of cancelling a deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r demo dist site/
          # A sitemap to submit in Google Search Console. (robots.txt only works at the domain root, so there is none.)
          SITE=https://majid-ali-watto.github.io/Loaders
          echo "<!doctype html><meta charset=\"utf-8\"><title>circle-loader</title><link rel=\"canonical\" href=\"$SITE/demo/\"><meta http-equiv=\"refresh\" content=\"0; url=demo/\"><a href=\"demo/\">circle-loader playground</a>" > site/index.html
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>%s/demo/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$SITE" "$(date -u +%F)" > site/sitemap.xml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
